[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.17"
optimizer = true
optimizer_runs = 200

remappings = [
  "@openzeppelin/contracts-upgradeable/=lib/oz-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/oz-base/contracts/",
  "@keep-network/bitcoin-spv-sol/=lib/btc-spv-sol/package/",
  "@thesis/solidity-contracts/=lib/thesis-contracts/",
  "@keep-network/random-beacon/=lib/rb/package/",
  "@keep-network/ecdsa/=lib/ecdsa/package/",
  "@keep-network/sortition-pools/=lib/sp/package/",
  "@keep-network/tbtc-v2/=src/",
]
